{% extends 'base.html' %}

{% block content %}
<div class="flex" style="gap: 40px; flex-wrap: wrap;">
    <div style="flex: 2; min-width: 300px;">
        <h2>Checkout</h2>
        <p style="color: #666; margin-bottom: 30px;">Please enter your shipping details.</p>
        
        <form method="POST" action="{% url 'checkout' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" name="full_name" id="full_name" class="form-control" required value="{{ request.user.first_name }} {{ request.user.last_name }}">
            </div>
            
            <div class="flex" style="gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" class="form-control" required value="{{ request.user.email }}">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="phone">Phone Number</label>
                    <input type="text" name="phone" id="phone" class="form-control" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" name="address" id="address" class="form-control" required>
            </div>
            
            <div class="flex" style="gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label for="city">City</label>
                    <input type="text" name="city" id="city" class="form-control" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="state">State</label>
                    <input type="text" name="state" id="state" class="form-control" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="pincode">Pincode</label>
                    <input type="text" name="pincode" id="pincode" class="form-control" required>
                </div>
            </div>

            <hr style="margin: 30px 0; border: none; border-top: 1px solid #ddd;">
            
            <h3 class="mb-4">Payment Method</h3>
            <p style="margin-bottom: 20px;">You will be redirected to Paytm to securely complete your purchase.</p>
            
            <button type="submit" class="btn btn-primary" style="padding: 15px 30px; font-size: 1.1rem; margin-top: 10px;">Pay with Paytm - ₹{{ total }}</button>
        </form>
    </div>
</div>
{% endblock %}
