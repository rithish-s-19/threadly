{% extends 'base.html' %}

{% block content %}
<div style="display: flex; gap: 40px; flex-wrap: wrap; margin-top: 40px;">
    <div style="flex: 1; min-width: 300px;">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}" style="width: 100%; border-radius: 8px; border: 1px solid var(--border-color);">
        {% else %}
            <div style="width: 100%; height: 400px; background: #eee; display:flex; align-items:center; justify-content:center; border-radius: 8px;">No Image</div>
        {% endif %}
    </div>
    
    <div style="flex: 1; min-width: 300px; padding: 20px 0;">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">{{ product.name }}</h1>
        <div style="font-size: 1.5rem; color: #666; margin-bottom: 20px;">₹{{ product.price }}</div>
        
        <p style="margin-bottom: 30px; color: #555;">{{ product.description }}</p>
        
        <form action="{% url 'add_to_cart' product.id %}" method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="color">Color</label>
                <select name="color" id="color" class="form-control" required>
                    {% for color in product.get_colors_list %}
                        <option value="{{ color }}">{{ color }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="size">Size</label>
                <select name="size" id="size" class="form-control" required>
                    {% for size in product.get_sizes_list %}
                        <option value="{{ size }}">{{ size }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" name="quantity" id="quantity" value="1" min="1" class="form-control" style="width: 100px;">
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button type="submit" class="btn btn-primary" style="padding: 15px 30px; font-size: 1.1rem; flex: 1;">Add to Cart</button>
                <a href="{% url 'customize' product.id %}" class="btn" style="padding: 15px 30px; font-size: 1.1rem; text-align: center;">Customize First</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
